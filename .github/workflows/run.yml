name: NFL Quote Miner

on:
  schedule:
    - cron: "0 12,18,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quote miner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          MAX_VIDEOS_PER_TEAM: "5"
          MIN_TRANSCRIPT_CHARS: "500"
        run: |
          python src/main.py

      - name: Publish NotebookLM digest to Google Doc
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
        run: |
          python src/publish_to_google_doc.py

      - name: Commit updates
        run: |
          git config user.name "nfl-quote-miner-bot"
          git config user.email "bot@example.com"
          git add data/
          git commit -m "Update NFL quote miner data" || echo "No changes to commit"
          git push
